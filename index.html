<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netling</title>
    <meta name="description" content="A cyberpunk virtual pet living in a corrupted memory sector." />
    <meta name="theme-color" content="#14121f" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="device">
      <header class="brand">
        <span class="logo">NETLING</span>
        <span class="prefs">
          <button type="button" id="pref-sound" class="pref" aria-pressed="true">SND ON</button>
          <button type="button" id="pref-alerts" class="pref" aria-pressed="false">ALERTS OFF</button>
          <button type="button" id="open-archive" class="pref archive-btn">ARCHIVE</button>
        </span>
      </header>

      <div class="screen">
        <canvas id="lcd" width="400" height="280" aria-label="Netling display"></canvas>
        <div class="scanlines"></div>
        <div class="crt-glare"></div>
        <div id="status" class="status" role="status"></div>
        <section id="flatline" class="flatline" hidden>
          <h2>FLATLINED</h2>
          <p id="fl-title"></p>
          <dl>
            <dt>cause</dt><dd id="fl-cause"></dd>
            <dt>uptime</dt><dd id="fl-age"></dd>
            <dt>faults</dt><dd id="fl-faults"></dd>
            <dt>echo</dt><dd id="fl-echo"></dd>
            <dt>fragment</dt><dd id="fl-trait"></dd>
          </dl>
          <button id="fl-next" type="button">COMPILE</button>
        </section>
      </div>

      <section class="hud" aria-label="Vitals">
        <div class="stat"><label>CHG</label><div id="bar-charge" class="bar"></div></div>
        <div class="stat"><label>SYN</label><div id="bar-sync" class="bar"></div></div>
        <div class="stat"><label>INT</label><div id="bar-integrity" class="bar"></div></div>
        <div class="stat"><label>HEAT</label><div id="bar-heat" class="bar heat"></div></div>
        <div class="stat">
          <label>CACHE</label>
          <div id="cache-pips" class="pips"><i></i><i></i><i></i><i></i></div>
        </div>
      </section>

      <p id="readout" class="readout"></p>

      <div id="event-bar" class="event-bar" role="alert" hidden>
        <span class="event-label">CORP TRACE <b id="event-timer"></b></span>
        <button type="button" data-act="hide">HIDE</button>
        <button type="button" data-act="comply">COMPLY</button>
      </div>

      <nav id="controls" class="controls" aria-label="Actions">
        <button type="button" data-act="corp">CORP PKT</button>
        <button type="button" data-act="scav">SCAV DATA</button>
        <button type="button" id="btn-play">PLAY</button>
        <button type="button" data-act="patch">PATCH</button>
        <button type="button" data-act="cool">COOL</button>
        <button type="button" data-act="purge">PURGE</button>
        <button type="button" data-act="lights" id="btn-lights" class="wide">LIGHTS OFF</button>
      </nav>

      <nav id="picker" class="controls" aria-label="Mini-games" hidden>
        <button type="button" data-game="breach">BREACH</button>
        <button type="button" data-game="dodge">DODGE</button>
        <button type="button" data-game="tune">TUNE</button>
        <button type="button" id="picker-back" class="wide">BACK</button>
      </nav>

      <nav id="pad" class="controls pad" aria-label="Game controls" hidden>
        <button type="button" data-key="left" aria-label="Left">&#9664;</button>
        <button type="button" data-key="a" class="pad-a">A</button>
        <button type="button" data-key="right" aria-label="Right">&#9654;</button>
        <button type="button" id="pad-quit" class="wide">QUIT (ESC)</button>
      </nav>

      <ul id="log" class="log" aria-live="polite"></ul>

      <div id="dev" class="dev" hidden>
        <span>DEV</span>
        <button type="button" data-skip="15">+15m</button>
        <button type="button" data-skip="60">+1h</button>
        <button type="button" data-skip="480">+8h</button>
        <button type="button" id="dev-evolve">EVO</button>
        <button type="button" id="dev-trace">TRACE</button>
        <button type="button" id="dev-reset">RESET</button>
      </div>
    </main>

    <dialog id="archive" class="archive" aria-labelledby="archive-title">
      <header>
        <h2 id="archive-title">ARCHIVE</h2>
        <button type="button" id="close-archive" class="pref" aria-label="Close archive">CLOSE</button>
      </header>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-btn-lineage" aria-selected="true" aria-controls="tab-lineage">LINEAGE</button>
        <button type="button" role="tab" id="tab-btn-dex" aria-selected="false" aria-controls="tab-dex">DEX <span id="dex-count"></span></button>
      </div>
      <section id="tab-lineage" role="tabpanel" aria-labelledby="tab-btn-lineage">
        <ol id="lineage-list" class="lineage"></ol>
      </section>
      <section id="tab-dex" role="tabpanel" aria-labelledby="tab-btn-dex" hidden>
        <ul id="dex-grid" class="dex"></ul>
      </section>
    </dialog>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
