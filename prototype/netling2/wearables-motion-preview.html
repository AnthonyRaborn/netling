<!doctype html>
<meta charset="utf-8">
<title>Wearables over motion, and the holologo options</title>
<style>body{margin:0;background:#000;color:#c7f9ff;font:14px monospace}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Review renders for docs/NETLING_2_SPRITES.md (Next phase, items 3 and 4, and the holologo open decision). Three sections, picked by
// the hash (#sec=blank, #sec=handler, #sec=holologo; scale=n): every LCD is the 2.0 renderer's (render.js composeLCD), idle off for the
// first two so the steps line up. The holologo options are drawn here only (src/ is under the freeze): `now` is 1.0's (a.top - 4),
// `lower` one row lower (a.top - 3), `clamp` 1.0's position pushed down only on the frames where it would leave the screen.
import './ready.js';
import { ACCESSORIES, placeWorn } from '../../src/accessories.js';
import { composeLCD, paintLCD, LCD_W, LCD_H } from './render.js';
import { forms } from './models.js';
import { programForms } from './program-models.js';
import { wetwareForms } from './wetware-models.js';
import { rogueForms } from './rogue-models.js';
const hash = new URLSearchParams(location.hash.slice(1));
const SC = Number(hash.get('scale') ?? 4);
const SEC = hash.get('sec') ?? 'blank';
const GAP = 3, LABEL = 18;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const holo = ACCESSORIES.find((a) => a.id === 'holologo');
const orig = holo.draw;

// Replaces the scene's worn op by its pixels, with the holologo option applied.
function withHolo(scene, option) {
  const ops = [];
  for (const o of scene.ops) {
    if (o.op !== 'worn') { ops.push(o); continue; }
    holo.draw = option === 'lower' ? (px, a, fr) => orig((x, y, col) => px(x, y + 1, col), a, fr) : orig;
    for (const w of placeWorn(o.list, o.sprite, { frame: o.frame, time: o.time, pal: o.pal, minRow: -o.y })) {
      let pts = w.pts;
      if (option === 'clamp' && w.id === 'holologo') {
        const top = Math.min(...pts.map((p) => p.y + o.y));
        if (top < 0) pts = pts.map((p) => ({ ...p, y: p.y - top }));
      }
      for (const p of pts) ops.push({ op: 'rect', x: o.x + p.x, y: o.y + p.y, w: 1, h: 1, color: p.color });
    }
    holo.draw = orig;
  }
  return { ...scene, ops };
}

function grid(rows, cols, label, cell) {
  c.width = (GAP + cols.length * (LCD_W + GAP)) * SC;
  c.height = rows.length * (LABEL + (LCD_H + GAP) * SC) + 4;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
  let y0 = 0;
  for (const r of rows) {
    ctx.fillStyle = '#c7f9ff'; ctx.font = '13px monospace'; ctx.textBaseline = 'top';
    ctx.fillText(label(r), 4, y0 + 2);
    y0 += LABEL;
    cols.forEach((col, i) => {
      ctx.save(); ctx.translate((GAP + i * (LCD_W + GAP)) * SC, y0); ctx.scale(SC, SC);
      paintLCD(ctx, cell(r, col));
      ctx.fillStyle = '#c7f9ff99'; ctx.font = '2.4px monospace'; ctx.fillText(typeof col === 'object' ? col.name : `step ${col}`, 1, LCD_H - 3);
      ctx.restore();
    });
    y0 += (LCD_H + GAP) * SC;
  }
}

if (SEC === 'blank' || SEC === 'handler') {
  const blank = SEC === 'blank';
  const form = blank ? wetwareForms().wetwareElderHidden : rogueForms().rogueElderTune;
  const egg = blank ? 'wetware' : 'rogue';
  const ids = blank
    ? ['cap', 'headphones', 'visor', 'scarf', 'spikedcollar', 'checksum', 'powercell', 'dataaura', 'bowtie', 'crown']
    : ['headphones', 'earpiece', 'neuraljack', 'dataaura', 'cap', 'crown'];
  const steps = blank ? [0, 2, 3, 6, 9, 11] : [0, 1, 2, 3, 4];
  grid(ids, steps, (id) => `${blank ? 'Blank elder' : 'Handler'} + ${id}`, (id, s) =>
    composeLCD({ form, egg, idle: 'none', worn: [{ id }] }, s * 400 + 1));
} else {
  // Per egg the tallest and the shortest form whose holologo leaves the screen, at the first moment it does (1.0's idle, walk).
  const eggs = { iron: forms('B'), program: programForms(), wetware: wetwareForms(), rogue: rogueForms() };
  const picks = [];
  for (const [egg, fs] of Object.entries(eggs)) {
    const clipping = [];
    for (const f of Object.values(fs)) {
      for (let t = 0; t < 60000; t += 100) {
        const sc = composeLCD({ form: f, egg, idle: 'walk', worn: [{ id: 'holologo' }] }, t);
        const w = sc.ops.find((o) => o.op === 'worn');
        if (w && placeWorn(w.list, w.sprite, { frame: w.frame, time: t, minRow: -w.y })[0].pts.some((p) => p.y + w.y < 0)) { clipping.push({ f, egg, t }); break; }
      }
    }
    clipping.sort((p, q) => q.f.a.length - p.f.a.length);
    picks.push({ ...clipping[0], name: `${clipping[0].f.id}` }, { ...clipping.at(-1), name: `${clipping.at(-1).f.id}` });
  }
  grid(['now', 'lower', 'clamp'], picks, (o) => ({ now: 'now: 1.0 (a.top - 4), at a moment it clips', lower: 'lower: one row lower (a.top - 3)', clamp: 'clamp: 1.0, pushed down only when it would clip' })[o],
    (o, p) => withHolo(composeLCD({ form: p.f, egg: p.egg, idle: 'walk', worn: [{ id: 'holologo' }] }, p.t), o));
}
document.title += ' (ready)';
</script>
