<!doctype html>
<meta charset="utf-8">
<title>Rogue options (thermocamo in motion)</title>
<style>body{margin:0;background:#000;color:#c7f9ff;font:14px monospace}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// The thermocamo in motion (rogue-options.js; docs/NETLING_2_ROGUE_DRAFTS.md, 8.4c and 8.4d), animating as the game would (the 1.0
// frame rhythm, A and B every 500 ms) with the decoy on. Second round: the Dodge line (Skip, Exile) shimmers as Cipher does (a scan band
// sweeping hood to feet and back, holes below it); the Tune line (Spook, Handler) wears the camo still, body only or head and body, so
// the two lines differ. Hints on Foundling and Alias as before. Blank and Cipher animate beside them for reference. Open with `npm run serve`:
// http://localhost:5174/prototype/netling2/rogue-options.html (#scale=5&palette=0; #t=1234 freezes the picture at that time in ms).
import './ready.js';
import { drawSprite, paletteColors } from '../../src/sprites.js';
import { PALETTES } from '../../src/sim.js';
import { wetwareForms } from './wetware-models.js';
import { rogueForms, rogueTag } from './rogue-models.js';
import { CAMO_OPTIONS, STATIC_CAMO_OPTIONS, cipherScan } from './rogue-options.js';

const hash = new URLSearchParams(location.hash.slice(1));
const SC = Number(hash.get('scale') ?? 5);
const pal = paletteColors(PALETTES[Number(hash.get('palette') ?? 0)]);
let fixed = hash.has('t') ? Number(hash.get('t')) : null;
const set = rogueForms();
const W = 26, H = 17, GAP = 3, LABEL = 22, ROW = H * SC + 6, FRAME_MS = 500;
const plain = (f) => ({ a: f.a, b: f.b });
// [form, [[label, frames, motion]...]] per row; motion defaults to the form's own (the decoy).
const scan = (id) => ({ a: set[id].a, b: set[id].b });
const rows = [
  [set.rogueBaby, [['plain', plain(set.rogueBaby)], ['hint', CAMO_OPTIONS.hint.make(set.rogueBaby, rogueTag('rogueBaby'))]]],
  [set.rogueTeen, [['plain', plain(set.rogueTeen)], ['hint', CAMO_OPTIONS.hint.make(set.rogueTeen, rogueTag('rogueTeen'))]]],
  ...['rogueAdultDodge', 'rogueElderDodge'].map((id) => [set[id], [['plain', plain(set[id])], ['Cipher shimmer', scan(id), cipherScan(set[id].stage)]]]),
  ...['rogueAdultTune', 'rogueElderTune'].map((id) => [set[id], [['plain', plain(set[id])], ['still, body', STATIC_CAMO_OPTIONS.body.make(set[id], rogueTag(id))], ['still, head+body', STATIC_CAMO_OPTIONS.whole.make(set[id], rogueTag(id))]]]),
];
const blank = wetwareForms().wetwareAdultHidden;
const cipher = wetwareForms().wetwareElderHidden;
const c = document.getElementById('c');
c.width = (6 * (W + GAP) + GAP) * SC;
c.height = LABEL + Math.ceil(rows.length / 2) * ROW + ROW + 10; // set before drawing: resizing clears
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
function cell(x0, y0, sprite, label) {
  ctx.save(); ctx.translate(x0 * SC, y0); ctx.scale(SC, SC);
  ctx.fillStyle = '#0b2226'; ctx.fillRect(0, 0, W, H);
  drawSprite(ctx, sprite, Math.floor((W - sprite[0].length) / 2), H - 1 - sprite.length, pal);
  ctx.fillStyle = '#c7f9ff88'; ctx.font = '2px monospace'; ctx.textBaseline = 'top'; ctx.fillText(label, 1, 0);
  ctx.restore();
}
const col = (i) => GAP + i * (W + GAP);
function draw(now) {
  const time = fixed ?? now;
  const frame = Math.floor(time / FRAME_MS) % 2 ? 'b' : 'a';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#c7f9ff'; ctx.font = `${Math.max(11, SC * 2.4)}px monospace`; ctx.textBaseline = 'top';
  ctx.fillText(`THERMOCAMO, second round: Dodge shimmers as Cipher, Tune wears it still. With the decoy. t=${(time / 1000).toFixed(1)} s`, 4, 2);
  rows.forEach(([f, variants], i) => {
    const y = LABEL + Math.floor(i / 2) * ROW;
    const base = (i % 2) * 3;
    variants.forEach(([label, frames, motion], j) => cell(col(base + j), y, (motion ?? f.motion)(frames[frame], f.anchors.a, { time }), `${f.name} ${label}`));
  });
  const y = LABEL + Math.ceil(rows.length / 2) * ROW;
  cell(col(0), y, frame === 'a' ? blank.a : blank.b, 'Blank (reference)');
  cell(col(1), y, cipher.motion(frame === 'a' ? cipher.a : cipher.b, cipher.anchors.a, { time }), 'Cipher (reference)');
  if (fixed === null) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
// For screenshots: draw the picture at a given time (ms) and stop the live loop.
window.drawAt = (t) => { fixed = t; draw(t); };
</script>
