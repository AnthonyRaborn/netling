<!doctype html>
<meta charset="utf-8">
<title>Style ideas: shells, tints, effects, labels, glow</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="style-ideas.css">
<style>
  body { display: block; min-height: 0; padding: 12px; margin: 0; background: #07070c; color: #c7f9ff; font: 14px VT323, monospace; }
  h2 { margin: 14px 0 6px; font-weight: normal; color: #05d9e8; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .cell { width: 200px; }
  .cell .device { max-width: 200px; padding: 10px 10px 12px; border-radius: 16px 16px 26px 26px; }
  .cell .logo { font-size: 18px; letter-spacing: 3px; }
  .cell p { margin: 4px 0 0; font-size: 13px; color: #809fa6; }
  .cell .hudl { margin: 6px 0 0; font-size: 14px; color: var(--text); }
  .cell .hudl i { font-style: normal; color: var(--dim); }
  .cell canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .cell .device { display: block; }
  .cell .screen { display: block; width: 100%; border-radius: 6px; border-width: 2px; }
  .cell .brand { margin: 0 0 6px; }
</style>
<div id="root"></div>
<script type="module">
// Review renders (style-ideas.js, style-ideas.css, ghosting.js, the Lava lamp glow). Sections by the hash (scale=n):
//   #sec=shells  every new shell beside Brushed chrome and the default, with the HUD text on it
//   #sec=tints   every new tint on all eight palettes (Infrared recolours the canvas pixels)
//   #sec=effects every new effect on a screen with a walking netling; Ghosting runs the real ghosting.js on the canvas cells
//   #sec=labels  the three labels on a dark and a light shell
//   #sec=glow    the eight props with a glow (Lava lamp, Mini arcade cabinet, Server tower, Desk terminal, Cyberdeck, Boom box, Petri dish, Fishbowl): lights on, off with the glow, off with it switched off
import './ready.js';
import { registerIdeas, PROP_ENTRIES } from './accessory-ideas.js';
import { registerPalettes } from './palettes.js';
import { composeLCD, paintLCD, LCD_W, LCD_H } from './render.js';
import { IDEA_SHELLS, IDEA_TINTS, IDEA_EFFECTS, IDEA_LABELS, infraredMap } from './style-ideas.js';
import { createGhosting } from './ghosting.js';
import { PALETTES } from '../../src/sim.js';
import { forms } from './models.js';
import { wetwareForms } from './wetware-models.js';
registerIdeas();
registerPalettes();
const hash = new URLSearchParams(location.hash.slice(1));
const SEC = hash.get('sec') ?? 'shells';
const FIXED = hash.has('t') ? Number(hash.get('t')) : null;
const root = document.getElementById('root');
const I = forms('B');
const W = wetwareForms();
const FORM = { form: I.ironAdultBreachStreet, egg: 'iron' };
const el = (tag, cls, html) => Object.assign(document.createElement(tag), { className: cls ?? '', innerHTML: html ?? '' });
const section = (title) => { root.append(el('h2', '', title)); const r = el('div', 'row'); root.append(r); return r; };
const lcdCanvas = () => { const c = el('canvas'); c.width = LCD_W * 10; c.height = LCD_H * 10; return c; };
const paint = (c, pet, t, tint) => {
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.save(); g.scale(10, 10);
  const scene = composeLCD({ ...FORM, idle: 'none', ...pet }, t);
  if (tint) scene.bg = tint.lcd;
  paintLCD(g, scene);
  g.restore();
};
const remap = (c, fn, keep) => {
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height);
  const cache = new Map();
  for (let i = 0; i < d.data.length; i += 4) {
    const k = (d.data[i] << 16) | (d.data[i + 1] << 8) | d.data[i + 2];
    const hexk = `#${k.toString(16).padStart(6, '0')}`;
    if (!cache.has(k)) cache.set(k, hexk === keep ? hexk : fn(hexk)); // the screen colour itself is not recoloured
    const o = cache.get(k);
    d.data[i] = parseInt(o.slice(1, 3), 16); d.data[i + 1] = parseInt(o.slice(3, 5), 16); d.data[i + 2] = parseInt(o.slice(5, 7), 16);
  }
  g.putImageData(d, 0, 0);
};
const device = (cls, name, note, pal = 0) => {
  const cell = el('div', 'cell');
  const dev = el('main', `device ${cls}`, `<header class="brand"><span class="logo">NETLING</span></header>`);
  const scr = el('div', 'screen'); const c = lcdCanvas();
  scr.append(c, el('div', 'scanlines'), el('div', 'fx-layer'));
  dev.append(scr, el('p', 'hudl', '<i>HUNGER 82%  CHARGE 64%</i>'));
  cell.append(dev, el('p', '', `${name}${note ? ` (${note})` : ''}`));
  paint(c, { palette: pal }, FIXED ?? 1000);
  return { cell, dev, scr, c };
};

if (SEC === 'shells') {
  const r = section('Shells');
  for (const [cls, name, note] of [['', 'Standard issue', '1.0'], ['shell-chrome', 'Brushed chrome', '1.0, light'], ...IDEA_SHELLS.map((s) => [`shell-${s.id}`, s.name, s.light ? 'light' : ''])]) r.append(device(cls, name, note).cell);
} else if (SEC === 'tints') {
  for (const t of IDEA_TINTS) {
    const r = section(`${t.name}: ${t.hint}`);
    PALETTES.forEach((p, i) => {
      const cell = el('div', 'cell'); const c = lcdCanvas();
      paint(c, { palette: i }, FIXED ?? 1000, t);
      if (t.remap) remap(c, t.remap, t.lcd);
      cell.append(c, el('p', '', p.name));
      cell.style.width = '150px';
      r.append(cell);
    });
  }
} else if (SEC === 'effects') {
  const r = section('Screen effects (the netling walks; scale the clock with t=ms)');
  for (const e of [{ id: 'scanlines', name: 'Scanlines (1.0)' }, ...IDEA_EFFECTS]) {
    const d = device(hash.get('shell') ?? '', e.name, e.pixel ? 'pixel effect' : ''); // shell=shell-clinicwhite puts them on a light shell
    d.scr.className = `screen fx-${e.id}`;
    r.append(d.cell);
    const ghost = e.id === 'ghosting' ? createGhosting() : null;
    const run = (t) => {
      const c = d.c; const g = c.getContext('2d');
      paint(c, { idle: 'walk', palette: 1 }, t);
      if (ghost) {
        // The canvas's cells (the middle pixel of each 10x10) through the real Ghosting, then repainted.
        const data = g.getImageData(0, 0, c.width, c.height).data;
        const cells = Array.from({ length: LCD_H }, (_, y) => Array.from({ length: LCD_W }, (_, x) => {
          const i = ((y * 10 + 5) * c.width + x * 10 + 5) * 4;
          return `#${[0, 1, 2].map((k) => data[i + k].toString(16).padStart(2, '0')).join('')}`;
        }));
        const out = ghost.step(cells, t);
        out.forEach((row, y) => row.forEach((col, x) => { g.fillStyle = col; g.fillRect(x * 10, y * 10, 10, 10); }));
      }
    };
    if (FIXED != null) { if (ghost) for (let t = Math.max(0, FIXED - 600); t <= FIXED; t += 50) run(t); else run(FIXED); } else { const loop = (t) => { run(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  }
} else if (SEC === 'labels') {
  const r = section('Labels on a dark and a light shell');
  for (const sh of ['', 'shell-clinicwhite', 'shell-rivet', 'shell-chrome']) for (const l of IDEA_LABELS) { const d = device(`${sh} label-${l.id}`, l.name, sh || 'standard'); d.dev.style.setProperty('--skin', '#05d9e8'); r.append(d.cell); }
} else if (SEC === 'glow') {
  for (const id of ['lavalamp', 'minicab', 'servertower', 'terminal', 'deck', 'boombox', 'petridish', 'fishbowl']) {
    const r = section(`${id}: lights on, lights off with the glow, lights off with the glow switched off, and the free version in the dark`);
    for (const [name, pet] of [['lights on', { lightsOn: true }], ['dark, glow on', { lightsOn: false }], ['dark, glow off', { lightsOn: false, propGlow: false }], ...(PROP_ENTRIES.some((e) => e.id === `${id}.free`) ? [['dark, free version', { lightsOn: false, prop: `${id}.free` }]] : [])]) {
      const cell = el('div', 'cell'); const c = lcdCanvas();
      paint(c, { prop: id, ...pet }, FIXED ?? 1000);
      cell.append(c, el('p', '', name)); cell.style.width = '300px'; r.append(cell);
    }
  }
}
document.title += ' (ready)';
</script>
